<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Radar / Drone Sweep Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Dam Wall Structure Geometry -->
  <path d="M120 380 L160 190 L352 190 L392 380 Z" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  
  <!-- Dam Spillway Pillars & Radial Gates -->
  <rect x="180" y="190" width="16" height="110" fill="#334155" rx="3"/>
  <rect x="220" y="190" width="16" height="110" fill="#334155" rx="3"/>
  <rect x="276" y="190" width="16" height="110" fill="#334155" rx="3"/>
  <rect x="316" y="190" width="16" height="110" fill="#334155" rx="3"/>

  <!-- Hydrodynamic Water Discharge Flows -->
  <path d="M196 240 Q204 310 180 380" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M236 240 Q244 320 230 380" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M260 240 Q268 320 282 380" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M292 240 Q308 310 332 380" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Reservoir Water Waves -->
  <path d="M160 190 Q210 175 256 190 T352 190 L352 210 L160 210 Z" fill="url(#waterGrad)"/>

  <!-- Satellite Sensor Waves & Drone Reticle -->
  <circle cx="256" cy="110" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <polygon points="256,98 266,118 246,118" fill="#ffffff"/>
  <path d="M216 110 A40 40 0 0 1 296 110" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M196 110 A60 60 0 0 1 316 110" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>

  <!-- Hydrodynamic Wave Crest at Base -->
  <path d="M96 380 Q176 340 256 380 T416 380 L416 410 Q336 370 256 410 T96 410 Z" fill="#0284c7" opacity="0.85"/>
  <path d="M96 410 Q176 370 256 410 T416 410 L416 430 L96 430 Z" fill="#0369a1" opacity="0.95"/>

  <!-- Indian Tricolor Accent Indicator Bar at Top -->
  <g transform="translate(196, 48)">
    <rect x="0" y="0" width="40" height="6" rx="3" fill="#ff9933"/>
    <rect x="40" y="0" width="40" height="6" rx="0" fill="#ffffff"/>
    <rect x="80" y="0" width="40" height="6" rx="3" fill="#138808"/>
  </g>
</svg>
